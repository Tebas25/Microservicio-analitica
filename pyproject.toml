[project]
name = "micro-analitica"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tebas25", email = "andres.almeida.yanez@udla.edu.ec" }
]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.141.1",
    "pydantic>=2.13.5",
    "pymongo[srv]>=4.17.0",
]

[project.scripts]
micro-analitica = "micro_analitica:main"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "flake8>=7.3.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
markers = [
    "unit: pruebas unitarias aisladas, sin dependencias externas",
    "integration: pruebas que requieren servicios externos (Mongo, etc.)",
]
asyncio_mode = "auto"
pythonpath = ["."]